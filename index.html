<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Register Imunisasi & BIAS - Puskesmas Melata</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        body { background-color: #f4f7f6; }
        .nav-tabs .nav-link.active { font-weight: bold; color: #0d6efd; }
        .spinner-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8); z-index: 9999; justify-content: center; align-items: center;
        }
    </style>
</head>
<body>

<div class="spinner-overlay" id="loadingSpinner">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>

<div class="container mt-4">
    <h2 class="text-center mb-4">Register Imunisasi & BIAS Puskesmas Melata</h2>
    
    <ul class="nav nav-tabs" id="myTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="input-tab" data-bs-toggle="tab" data-bs-target="#input" type="button" role="tab">Input & OCR</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="preview-tab" data-bs-toggle="tab" data-bs-target="#preview" type="button" role="tab">Data Register</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="kumulatif-tab" data-bs-toggle="tab" data-bs-target="#kumulatif" type="button" role="tab">Kumulatif & Logistik</button>
        </li>
    </ul>

    <div class="tab-content bg-white p-4 border border-top-0 rounded-bottom" id="myTabContent">
        
        <!-- TAB INPUT -->
        <div class="tab-pane fade show active" id="input" role="tabpanel">
            <form id="imunisasiForm">
                <input type="hidden" id="editId" value="">
                
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Scan Dokumen/KMS (OCR)</label>
                        <input type="file" class="form-control" id="ocrImage" accept="image/*">
                        <button type="button" class="btn btn-secondary mt-2 w-100" id="btnScanOCR">Ekstrak Teks (OCR)</button>
                        <textarea class="form-control mt-2" id="ocrResult" rows="2" placeholder="Hasil OCR akan muncul di sini..."></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Nama Anak / Siswa</label>
                        <input type="text" class="form-control" id="nama" required>
                        
                        <label class="form-label mt-2">NIK / No. RM</label>
                        <input type="text" class="form-control" id="nik" required>
                        
                        <label class="form-label mt-2">Tanggal Lahir</label>
                        <input type="date" class="form-control" id="tglLahir" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Tanggal Imunisasi</label>
                        <input type="date" class="form-control" id="tglImunisasi" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Antigen Vaksin</label>
                        <select class="form-select" id="antigen" required>
                            <option value="">Pilih Antigen...</option>
                            <option value="HB-0">HB-0</option>
                            <option value="BCG">BCG</option>
                            <option value="Polio Tetes (OPV)">Polio Tetes (OPV)</option>
                            <option value="Polio Suntik (IPV)">Polio Suntik (IPV)</option>
                            <option value="DPT-HB-Hib">DPT-HB-Hib (Pentabio)</option>
                            <option value="PCV">PCV</option>
                            <option value="Rotavirus (RV)">Rotavirus (RV)</option>
                            <option value="Campak-Rubella (MR)">Campak-Rubella (MR)</option>
                            <option value="DT">DT (BIAS)</option>
                            <option value="Td">Td (BIAS)</option>
                            <option value="HPV">HPV (BIAS)</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Logistik (Vaksin/ADS)</label>
                        <select class="form-select" id="logistik" required>
                            <option value="1 Dosis + 1 ADS 0.5ml">1 Dosis + 1 ADS 0.5ml</option>
                            <option value="1 Dosis + 1 ADS 0.05ml (BCG)">1 Dosis + 1 ADS 0.05ml (BCG)</option>
                            <option value="1 Dosis Tetes (Tanpa ADS)">1 Dosis Tetes (Tanpa ADS)</option>
                        </select>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary w-100" id="btnSubmit">Simpan Data</button>
                <button type="button" class="btn btn-warning w-100 mt-2 d-none" id="btnCancelEdit">Batal Edit</button>
            </form>
        </div>

        <!-- TAB PREVIEW DATA -->
        <div class="tab-pane fade" id="preview" role="tabpanel">
            <div class="table-responsive">
                <table class="table table-bordered table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>No.</th>
                            <th>Tgl Imunisasi</th>
                            <th>NIK</th>
                            <th>Nama</th>
                            <th>Antigen</th>
                            <th>Logistik Terpakai</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody">
                        <!-- Data render di sini -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- TAB KUMULATIF & FILTER -->
        <div class="tab-pane fade" id="kumulatif" role="tabpanel">
            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label">Filter Antigen</label>
                    <select class="form-select" id="filterAntigenKumulatif">
                        <option value="Semua">Semua Antigen</option>
                        <option value="HB-0">HB-0</option>
                        <option value="BCG">BCG</option>
                        <option value="Polio Tetes (OPV)">Polio Tetes (OPV)</option>
                        <option value="Polio Suntik (IPV)">Polio Suntik (IPV)</option>
                        <option value="DPT-HB-Hib">DPT-HB-Hib (Pentabio)</option>
                        <option value="PCV">PCV</option>
                        <option value="Rotavirus (RV)">Rotavirus (RV)</option>
                        <option value="Campak-Rubella (MR)">Campak-Rubella (MR)</option>
                        <option value="DT">DT (BIAS)</option>
                        <option value="Td">Td (BIAS)</option>
                        <option value="HPV">HPV (BIAS)</option>
                    </select>
                </div>
            </div>
            
            <div class="table-responsive">
                <table class="table table-bordered table-striped">
                    <thead class="table-primary">
                        <tr>
                            <th>No.</th>
                            <th>Jenis Antigen</th>
                            <th>Total Sasaran Diimunisasi</th>
                        </tr>
                    </thead>
                    <tbody id="kumulatifTableBody">
                        <!-- Data kumulatif render di sini -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, updateDoc, onSnapshot, query, orderBy } 
    from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

    // GANTI DENGAN KONFIGURASI FIREBASE ANDA
    const firebaseConfig = {
        apiKey: "API_KEY_ANDA",
        authDomain: "PROJECT_ID.firebaseapp.com",
        projectId: "PROJECT_ID",
        storageBucket: "PROJECT_ID.appspot.com",
        messagingSenderId: "SENDER_ID",
        appId: "APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const imunisasiRef = collection(db, "data_imunisasi");

    // UI Elements
    const form = document.getElementById("imunisasiForm");
    const editIdInput = document.getElementById("editId");
    const btnSubmit = document.getElementById("btnSubmit");
    const btnCancelEdit = document.getElementById("btnCancelEdit");
    const spinner = document.getElementById("loadingSpinner");
    const dataTableBody = document.getElementById("dataTableBody");
    const kumulatifTableBody = document.getElementById("kumulatifTableBody");
    const filterKumulatif = document.getElementById("filterAntigenKumulatif");

    let currentData = [];

    // Real-time listener for Firebase
    const q = query(imunisasiRef, orderBy("tglImunisasi", "desc"));
    onSnapshot(q, (snapshot) => {
        currentData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderPreviewTable(currentData);
        renderKumulatifTable(currentData);
    });

    // Render Tab 2: Preview Data
    function renderPreviewTable(data) {
        dataTableBody.innerHTML = "";
        data.forEach((item, index) => {
            dataTableBody.innerHTML += `
                <tr>
                    <td>${index + 1}</td>
                    <td>${item.tglImunisasi}</td>
                    <td>${item.nik}</td>
                    <td>${item.nama}</td>
                    <td>${item.antigen}</td>
                    <td>${item.logistik}</td>
                    <td>
                        <button class="btn btn-sm btn-info text-white" onclick="editData('${item.id}')">Edit</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteData('${item.id}')">Hapus</button>
                    </td>
                </tr>
            `;
        });
    }

    // Render Tab 3: Kumulatif & Logistik (dengan filter)
    function renderKumulatifTable(data) {
        kumulatifTableBody.innerHTML = "";
        const filterVal = filterKumulatif.value;
        
        let filteredData = data;
        if (filterVal !== "Semua") {
            filteredData = data.filter(item => item.antigen === filterVal);
        }

        // Hitung rekapan
        const summary = {};
        filteredData.forEach(item => {
            if (!summary[item.antigen]) summary[item.antigen] = 0;
            summary[item.antigen]++;
        });

        let index = 1;
        for (const [antigen, total] of Object.entries(summary)) {
            kumulatifTableBody.innerHTML += `
                <tr>
                    <td>${index++}</td>
                    <td>${antigen}</td>
                    <td>${total} Sasaran</td>
                </tr>
            `;
        }
        
        if(Object.keys(summary).length === 0) {
            kumulatifTableBody.innerHTML = `<tr><td colspan="3" class="text-center">Belum ada data untuk filter ini.</td></tr>`;
        }
    }

    // Filter Event Listener
    filterKumulatif.addEventListener("change", () => renderKumulatifTable(currentData));

    // Tambah & Update Data
    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        spinner.style.display = "flex";

        const formData = {
            nama: document.getElementById("nama").value,
            nik: document.getElementById("nik").value,
            tglLahir: document.getElementById("tglLahir").value,
            tglImunisasi: document.getElementById("tglImunisasi").value,
            antigen: document.getElementById("antigen").value,
            logistik: document.getElementById("logistik").value,
            timestamp: new Date().toISOString()
        };

        const idToEdit = editIdInput.value;

        try {
            if (idToEdit) {
                // Update
                const docRef = doc(db, "data_imunisasi", idToEdit);
                await updateDoc(docRef, formData);
                resetForm();
            } else {
                // Simpan Baru
                await addDoc(imunisasiRef, formData);
                form.reset();
            }
        } catch (error) {
            alert("Terjadi kesalahan: " + error.message);
        } finally {
            spinner.style.display = "none";
        }
    });

    // Fungsi Edit (Load data ke form)
    window.editData = (id) => {
        const item = currentData.find(d => d.id === id);
        if (item) {
            document.getElementById("nama").value = item.nama;
            document.getElementById("nik").value = item.nik;
            document.getElementById("tglLahir").value = item.tglLahir;
            document.getElementById("tglImunisasi").value = item.tglImunisasi;
            document.getElementById("antigen").value = item.antigen;
            document.getElementById("logistik").value = item.logistik;
            
            editIdInput.value = id;
            btnSubmit.innerText = "Update Data";
            btnSubmit.classList.replace("btn-primary", "btn-success");
            btnCancelEdit.classList.remove("d-none");
            
            // Pindah ke tab input
            document.getElementById("input-tab").click();
        }
    };

    // Fungsi Batal Edit
    btnCancelEdit.addEventListener("click", resetForm);

    function resetForm() {
        form.reset();
        editIdInput.value = "";
        btnSubmit.innerText = "Simpan Data";
        btnSubmit.classList.replace("btn-success", "btn-primary");
        btnCancelEdit.classList.add("d-none");
    }

    // Fungsi Hapus Data
    window.deleteData = async (id) => {
        if (confirm("Apakah Anda yakin ingin menghapus data ini?")) {
            spinner.style.display = "flex";
            try {
                await deleteDoc(doc(db, "data_imunisasi", id));
            } catch (error) {
                alert("Gagal menghapus: " + error.message);
            } finally {
                spinner.style.display = "none";
            }
        }
    };

    // Fungsi OCR Tesseract
    document.getElementById("btnScanOCR").addEventListener("click", () => {
        const imageInput = document.getElementById("ocrImage").files[0];
        if (!imageInput) {
            alert("Pilih gambar terlebih dahulu!");
            return;
        }

        spinner.style.display = "flex";
        const ocrResultBox = document.getElementById("ocrResult");
        ocrResultBox.value = "Sedang memindai gambar...";

        Tesseract.recognize(
            imageInput,
            'ind',
            { logger: m => console.log(m) }
        ).then(({ data: { text } }) => {
            ocrResultBox.value = text;
            
            // Logika Sederhana Auto-Fill NIK (mencari 16 digit angka)
            const nikMatch = text.match(/\b\d{16}\b/);
            if(nikMatch) document.getElementById("nik").value = nikMatch[0];

            spinner.style.display = "none";
        }).catch(err => {
            ocrResultBox.value = "Gagal memindai.";
            spinner.style.display = "none";
        });
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
